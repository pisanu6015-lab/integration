
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Inventory Card</title>
    <style>
        .card {
            border: 1px solid #ccc;
            padding: 16px;
            border-radius: 8px;
            width: 300px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="card" id="inventory-card">
        <h2>Inventory Item</h2>
        <p><strong>ชื่อสินค้า:</strong> Iphone 18 Pro Max</p>
        <p><strong>จำนวน:</strong> 10 ชิ้น</p>
        
        <p><strong>ผู้ดูแล:</strong> <span id="author-name">พิศนุ แสงปี</span></p>
    </div>
</body>
</html>
